version: '3.8'

services:
  app-logic:
    build: .
    restart: always
    expose:
      - "3000"

  web-server:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app-logic